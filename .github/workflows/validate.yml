# The two checks HACS asks of an integration repository: its own validator,
# which is what runs when a user adds this as a custom repository, and
# Home Assistant's hassfest, which checks the manifest, services.yaml and
# translations against the current core.
#
# Daily as well as on push, because both validators move: a repository that
# passed in March can fail in June without a single commit here.
#
# Every check runs, including `topics` and `brands`. These repository checks
# run only in this action - HACS does not apply them when a user adds the
# repository by hand - but they are what the HACS default store requires, so
# keeping them green keeps that door open. The topics live in the GitHub
# repository settings, not in this tree.

name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
