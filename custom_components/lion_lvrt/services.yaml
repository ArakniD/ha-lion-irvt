configure_slot:
  name: Configure slot
  description: >-
    Apply a cell profile to one slot. Every field except the chemistry is
    optional; a zero means "use the chemistry or model default". Refused while
    the slot is running.
  fields:
    slot:
      name: Slot
      description: Zero-based slot index. Front-panel slot 3 is slot 2.
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    chemistry:
      name: Chemistry
      required: true
      selector:
        select:
          options: [lco, lto, lfp, nmc, nca, none]
    model_name:
      name: Model name
      selector:
        text:
    serial:
      name: Serial
      description: Cell barcode. Can also be set later, up to the moment the result is stored.
      selector:
        text:
    capacity_mah:
      name: Capacity
      description: Rated capacity in mAh. 0 uses the model default.
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: mAh
          mode: box
    charge_c:
      name: Charge C-rate
      description: 0 uses the chemistry default.
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          mode: box
    discharge_c:
      name: Discharge C-rate
      description: 0 uses the chemistry default.
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          mode: box
    auto_recharge:
      name: Recharge to shipping state
      description: Put back a fraction of the removed charge after the discharge.
      selector:
        boolean:
    shipping_pct:
      name: Shipping state of charge
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    max_duration_minutes:
      name: Timeout
      description: Abort the test after this long. 0 means no limit.
      selector:
        number:
          min: 0
          max: 100000
          unit_of_measurement: min
          mode: box
    entry_id:
      name: Tester
      description: Required only when more than one tester is configured.
      selector:
        text:

set_serial:
  name: Set serial
  description: >-
    Assign a barcode to a slot. Allowed at any point up to the moment the
    result is persisted, so a cell can be scanned after the test starts.
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    serial:
      name: Serial
      required: true
      selector:
        text:
    entry_id:
      name: Tester
      selector:
        text:

resume_slot:
  name: Resume slot
  description: >-
    Resume a paused run. A slot paused by the host watchdog or restored from
    F-RAM after a unit reset is refused unless 'force' is set: the unit lost
    contact with the host mid-run, so the cell in the holder may not be the
    cell the counters belong to.
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    force:
      name: Force
      description: >-
        Resume even though the pause needs an operator decision. Confirm the
        cell in the holder is the one the run started with.
      selector:
        boolean:
    entry_id:
      name: Tester
      selector:
        text:

set_mode:
  name: Set slot mode
  description: >-
    Command the converter directly - charge, discharge or stop. This is not
    the characterisation test; it runs until stopped or until a limit trips.
    Needs a register-capable transport (CAN, HTTP, or BLE firmware with the
    register characteristic).
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    mode:
      name: Mode
      required: true
      selector:
        select:
          options: [stop, charge, discharge]
    entry_id:
      name: Tester
      selector:
        text:

calibration_command:
  name: Calibration command
  description: >-
    Drive the two-point calibration state machine, one opcode at a time.
    Returns the live telemetry so a bench supply can be adjusted against it.
    Only 'enter' takes a slot; every other command applies to whichever slot
    the unit already has in calibration.
  fields:
    command:
      name: Command
      required: true
      selector:
        select:
          options:
            - enter
            - exit
            - capture_voltage
            - zero_current
            - set_fixed_current
            - capture_current
            - compute_save
            - clear
    slot:
      name: Slot
      description: Read only by 'enter'.
      selector:
        number:
          min: 0
          max: 7
          mode: box
    value:
      name: Value
      description: >-
        Measured volts for capture_voltage, measured amps for capture_current,
        or a per-unit setpoint (0.0-0.8, where 1.0 pu is about 10 A) for
        set_fixed_current. Ignored by the others.
      selector:
        number:
          min: -100
          max: 100
          step: any
          mode: box
    entry_id:
      name: Tester
      selector:
        text:

get_result:
  name: Get slot result
  description: >-
    Read a slot's stored test result. Note that completed_uptime_s is seconds
    of proxy uptime, not a wall clock - the device has no real-time clock.
  fields:
    slot:
      name: Slot
      required: true
      selector:
        number:
          min: 0
          max: 7
          mode: box
    entry_id:
      name: Tester
      selector:
        text:

sync_models:
  name: Sync cell models
  description: >-
    Upload the custom cell models listed in lion_lvrt_models.yaml (in the Home
    Assistant config folder) to the tester. The tester stores up to 12, beside
    its built-in models, and they then appear in every slot's model list and
    on the front panel. Adds and updates only - a model not in the file is
    left on the tester. Returns what was uploaded and any entries refused.
  fields:
    entry_id:
      name: Tester
      selector:
        text:

delete_model:
  name: Delete cell model
  description: >-
    Remove a custom cell model from the tester. Built-in models cannot be
    deleted. A slot still configured with the model comes up unconfigured at
    the next restart.
  fields:
    entry_id:
      name: Tester
      selector:
        text:
    name:
      name: Model name
      description: The custom model to delete, e.g. VTC6A.
      required: true
      selector:
        text:

assign_code:
  name: Assign code to slot
  description: >-
    Bind a scanned cell barcode to a slot. From then until the code is
    replaced or cleared, every charge or discharge that finishes in that slot
    is logged against it as a lion_lvrt_cycle_completed event. Scan the slot
    label into slot_code and the cell barcode into code; on a bench with one
    tester the slot number alone is enough.
  fields:
    slot_code:
      name: Scanned slot label
      description: >-
        The barcode on the slot, e.g. e465b810d93a-3. Carries the tester's
        Bluetooth address and the front-panel slot number, so no other field
        is needed. Use 'slot' instead if your dashboard has a slot picker.
      example: e465b810d93a-3
      selector:
        text:
    code:
      name: Cell code
      description: The barcode scanned from the battery.
      required: true
      example: CELL-00417
      selector:
        text:
    slot:
      name: Slot
      description: >-
        Zero-based slot index, for a dashboard that picks rather than scans.
        Overrides the slot in slot_code. Front-panel slot 3 is slot 2.
      selector:
        number:
          min: 0
          max: 7
          mode: box
    address:
      name: Tester Bluetooth address
      description: >-
        Which tester, when more than one is configured and the slot code does
        not name it. Separators and case are ignored.
      example: e465b810d93a
      selector:
        text:
    set_serial:
      name: Also set the slot serial
      description: >-
        Send the code to the tester as the slot's serial, so it reaches the
        unit's own stored result and the front panel. On by default. The
        assignment is kept here even if the tester is unreachable.
      selector:
        boolean:
    apply_to_last_cycle:
      name: Apply to the last cycle
      description: >-
        For scanning the cell after the run instead of before: attach this
        code to the slot's most recent cycle that has none. Never overwrites
        a cycle that already carries a code.
      selector:
        boolean:
    note:
      name: Note
      description: Free text stored with the assignment, e.g. the operator or batch.
      selector:
        text:
    entry_id:
      name: Tester
      description: Required only when more than one tester is configured and no address is given.
      selector:
        text:

clear_code:
  name: Clear slot code
  description: >-
    Unbind the cell code from a slot. Cycles already logged keep the code
    they were recorded with; cycles after this are logged with none.
  fields:
    slot_code:
      name: Scanned slot label
      example: e465b810d93a-3
      selector:
        text:
    slot:
      name: Slot
      selector:
        number:
          min: 0
          max: 7
          mode: box
    address:
      name: Tester Bluetooth address
      example: e465b810d93a
      selector:
        text:
    entry_id:
      name: Tester
      selector:
        text:

get_cycles:
  name: Get recent cycles
  description: >-
    Return the recent completed cycles this integration kept, newest first,
    optionally filtered by slot or cell code. This is a bounded tail for
    dashboards - the full history is in Home Assistant's recorder under the
    lion_lvrt_cycle_completed event.
  fields:
    slot:
      name: Slot
      description: Only this slot's cycles.
      selector:
        number:
          min: 0
          max: 7
          mode: box
    code:
      name: Cell code
      description: Only cycles logged against this code.
      selector:
        text:
    limit:
      name: Limit
      description: How many to return, newest first.
      selector:
        number:
          min: 1
          max: 200
          mode: box
    address:
      name: Tester Bluetooth address
      example: e465b810d93a
      selector:
        text:
    entry_id:
      name: Tester
      selector:
        text:
